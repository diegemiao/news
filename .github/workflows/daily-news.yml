name: Daily News Digest v2

on:
  schedule:
    - cron: '0 9,18 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email notification'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'data/feeds.json'
      - '.github/workflows/daily-news.yml'

concurrency:
  group: news-digest
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Fetch news and generate
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          SEND_EMAIL: ${{ inputs.send_email || false }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL || 'https://<user>.github.io/news/' }}
          GITEE_PAGES_URL: ${{ vars.GITEE_PAGES_URL || 'https://<user>.gitee.io/news/' }}
        run: node scripts/main.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save generated files away, then pull latest
          cp docs/index.html /tmp/index.html
          cp data/archive.json /tmp/archive.json
          git stash --include-untracked
          git pull --rebase origin master
          git stash pop || true
          # Always use our freshly generated content
          cp /tmp/index.html docs/index.html
          cp /tmp/archive.json data/archive.json
          git add data/archive.json docs/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$(date +%Y-%m-%d) 新闻速递自动更新"
            git push origin master
          fi
