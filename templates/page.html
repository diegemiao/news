<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, max-age=0, must-revalidate">
<title>{{PERIOD}}新闻速递 &middot; {{DATE}}</title>
<link rel="stylesheet" href="style.css?v={{VERSION}}">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
</head>
<body>

<div class="container">
  <header class="header">
    <h1 class="header-title">{{PERIOD}}新闻速递</h1>
    <p class="header-meta">{{DATE}} &middot; {{COUNT}} 篇 &middot; {{GENERATED_TIME}} 更新</p>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="全部">全部</button>
    {{TABS}}
  </nav>

  <main class="main">
    {{ARTICLES}}
  </main>

  <footer class="footer">
    <nav class="footer-links">
      <a href="https://github.com" rel="noopener">GitHub</a>
      <span>&middot;</span>
      <a href="https://gitee.com" rel="noopener">Gitee</a>
    </nav>
    <p class="footer-note">由 GitHub Actions 自动生成 &middot; 每日 9:00 / 18:00 更新 &middot; 仅推送时效内新闻</p>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-header">
      <span class="modal-source" id="modalSource"></span>
      <span class="modal-time" id="modalTime"></span>
    </div>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="modal-btn-source" id="modalBtnSource" title="查看原文">&#128279;</button>
      <span class="modal-link-wrap" id="modalLinkWrap">
        <a class="modal-link" id="modalLink" target="_blank" rel="noopener">查看原文 &rarr;</a>
      </span>
      <button class="modal-btn-full" id="modalBtnFull">查看全部 &#9660;</button>
    </div>
  </div>
</div>

<script>window.newsData = {{NEWS_DATA}};</script>
<script src="app.js?v={{VERSION}}"></script>
</body>
</html>
